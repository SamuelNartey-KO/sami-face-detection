<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sami Face Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Sami Face Detector</h1>
    <p>Upload a photo and the model will look for Sami's face.</p>
  </header>

  <main>
    <div class="card">
      <h2>Choose a Photo</h2>

      <label class="file-button">
        <input type="file" id="file-input" accept="image/*">
        <span>Select a photo</span>
      </label>

      <p id="status" class="status">Loading model...</p>

      <div class="controls">
        <label class="slider-label">
          Confidence: <strong id="confidence-value">50%</strong>
          <input type="range" id="confidence" min="5" max="95" step="5" value="50">
        </label>
        <label class="check-label">
          <input type="checkbox" id="best-only">
          Show best match only
        </label>
      </div>

      <div id="result" class="result hidden"></div>
      <canvas id="canvas" class="hidden"></canvas>
    </div>
  </main>

  <footer>
    <p>YOLO26n model trained on the Ultralytics Platform and run in your browser.</p>

  </footer>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
